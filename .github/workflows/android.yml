name: android

# Commit message markers: [testlab] runs Firebase Test Lab, [deliver] sends the APK to App Distribution group "dev".
on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  # Never cancel a running pipeline: it may be a [testlab]/[deliver] run.
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: agent-farm-f0701
  FIREBASE_APP_ID: "1:426334010939:android:ead4c441732d1dbf17e61e"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Repo gate (encoding, credentials, dev codes, size, core purity, changelog, pipeline)
        run: node test/run-all.js

      - name: Unit tests + debug APK + instrumentation APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks-b${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-b${{ github.run_number }}
          path: app/build/reports/tests/

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apks-b${{ github.run_number }}
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests and capture screens on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # No Play services: on a fresh google_apis image they restart themselves mid-run and kill every
          # app holding one of their providers (the WebView's fonts). Real devices with Play: Test Lab.
          target: default
          profile: pixel_6
          disable-animations: true
          script: bash scripts/ci/emulator-run.sh

      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-b${{ github.run_number }}
          path: emulator-out/

  testlab:
    needs: build
    if: contains(github.event.head_commit.message, '[testlab]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apks-b${{ github.run_number }}
          path: apks

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run on Firebase Test Lab
        run: bash scripts/ci/testlab-run.sh

      - name: Upload Test Lab results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testlab-b${{ github.run_number }}
          path: testlab-out/

  deliver:
    needs: [build, emulator]
    if: contains(github.event.head_commit.message, '[deliver]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apks-b${{ github.run_number }}
          path: apks

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Send to App Distribution
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: bash scripts/ci/deliver.sh
